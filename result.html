<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Result Management System</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #eef2ff;
      padding: 30px;
    }

    .container {
      max-width: 1100px;
      margin: auto;
    }

    .header {
      background: #1e3a8a;
      color: white;
      padding: 25px;
      border-radius: 12px;
      margin-bottom: 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .dashboard {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .box {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
    }

    .box h2 {
      color: #2563eb;
      margin-bottom: 10px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
    }

    th {
      background: #2563eb;
      color: white;
    }

    th, td {
      padding: 15px;
      text-align: left;
      border-bottom: 1px solid #ddd;
    }

    tr:hover {
      background: #f3f4f6;
    }

    .status {
      padding: 6px 12px;
      border-radius: 20px;
      color: white;
      background: green;
      display: inline-block;
    }
  </style>
</head>
<body>

  <div class="container">

    <div class="header">
      <div>
        <h1>School Result Management System</h1>
        <p>Manage student records and examination results</p>
      </div>

    </div>

    <div class="dashboard">
      <div class="box">
        <h2>1,250</h2>
        <p>Total Students</p>
      </div>

      <div class="box">
        <h2>42</h2>
        <p>Teachers</p>
      </div>

      <div class="box">
        <h2>96%</h2>
        <p>Pass Rate</p>
      </div>

      <div class="box">
        <h2>12</h2>
        <p>Subjects</p>
      </div>
    </div>

    <table>
      <tr>
        <th>Student Name</th>
        <th>Class</th>
        <th>Average</th>
        <th>Status</th>
      </tr>

      <tr>
        <td>John Michael</td>
        <td>Form Four</td>
        <td>84%</td>
        <td><span class="status">Pass</span></td>
      </tr>

      <tr>
        <td>Sarah Wilson</td>
        <td>Form Two</td>
        <td>91%</td>
        <td><span class="status">Pass</span></td>
      </tr>

      <tr>
        <td>Daniel Joseph</td>
        <td>Form Three</td>
        <td>78%</td>
        <td><span class="status">Pass</span></td>
      </tr>
    </table>

  </div>

</body>
</html>
